services:
  # Backend Express API Service
  - type: web
    name: leafscan-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: "*"
      - key: MONGO_URI
        sync: false # Set in Render dashboard (e.g. MongoDB Atlas connection string)
    healthCheckPath: /api/health

  # Frontend React Vite Static Site
  - type: static
    name: leafscan-web
    rootDir: app
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: leafscan-api
          property: host
